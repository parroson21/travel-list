<div class="profile-container" *ngIf="vm$ | async as vm">

    <!-- Hero: map + list side by side (viewport height) -->
    <div class="page-split" [class.sheet-open]="selectedSite">

        <!-- Left: World Map -->
        <div class="profile-map-section glass-panel fade-in">
            <app-world-map [visitedCountryNames]="vm.visitedCountryNames" [plannedCountryNames]="vm.plannedCountryNames"
                [focusedCountry]="highlightedCountry" [heritageSites]="vm.heritageSites"
                [visitedPOIIds]="vm.visitedPOIIds" [showOnlyVisitedSites]="true" [height]="'100%'"
                [highlightedSiteId]="hoveredSiteId" (poiToggled)="openSiteFromPin($event, vm.heritageSites)"
                (countryClicked)="onMapCountryClicked($event, vm.countries)">
            </app-world-map>
        </div>

        <!-- Right panel -->
        <div class="right-panel">
            <app-profile-panel
                [visitedEntryRows]="vm.visitedEntryRows"
                [plannedEntryRows]="vm.plannedEntryRows"
                [visitedHeritageSites]="vm.visitedHeritageSites"
                [hoveredSiteId]="hoveredSiteId"
                (rowFocused)="focusOnMap($event)"
                (countryNavigate)="navigateToCountry($event)"
                (editRequested)="onEditRequested($event)"
                (selectedSiteChange)="onPanelSiteChange($event)"
                (siteFlyTo)="onSiteFlyTo($event)"
                (siteHoverChange)="setSiteHover($event)">
            </app-profile-panel>
        </div><!-- /right-panel -->
    </div><!-- /page-split -->

    <!-- Stats section -->
    <app-profile-stats
        *ngIf="auth.user$ | async as user"
        [user]="user"
        [profile]="vm.profile || null"
        [homeCountry]="vm.homeCountry"
        [visitedCountries]="vm.visitedCountries"
        [stats]="vm.stats"
        (homePickerOpen)="openHomePicker($event)">
    </app-profile-stats>

</div>

<!-- Home country picker – modal-style, fixed to escape stacking contexts -->
@if (homePickerOpen) {
<div class="home-picker-overlay" (click)="closeHomePicker()"></div>
<div class="home-picker home-picker-fixed" [style.top.px]="pickerAnchorTop" [style.right.px]="pickerAnchorRight"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="hpick-header">
        <span class="hpick-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Home Country
        </span>
        <button class="hpick-close" (click)="closeHomePicker()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <!-- Remove button (if country is set) -->
    <ng-container *ngIf="vm$ | async as vm">
        <div class="hpick-remove-row" *ngIf="vm.homeCountry">
            <button class="hpick-remove-btn" (click)="saveHomeCountry(null)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6M14 11v6" />
                </svg>
                Remove home country
            </button>
        </div>
    </ng-container>

    <!-- Search -->
    <div class="hpick-search-wrap">
        <svg class="hpick-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input class="hpick-search" [(ngModel)]="homeSearch" placeholder="Search countries…" autofocus>
    </div>

    <!-- Country list -->
    <div class="hpick-list">
        <ng-container *ngIf="vm$ | async as vm">
            <button *ngFor="let c of filteredHomeCountries(vm.countries)" class="hpick-item"
                [class.hpick-item--active]="c.id === vm.profile?.homeCountryId" (click)="saveHomeCountry(c.id)">
                <span class="flag-emoji">{{ c.emoji }}</span>
                <span class="hpick-item-name">{{ c.name }}</span>
                <svg *ngIf="c.id === vm.profile?.homeCountryId" class="hpick-check" width="13" height="13"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </button>
        </ng-container>
    </div>
</div>
}

<!-- Edit entry modal (from profile) -->
@if (editModalCountry && editModalEntry) {
<app-add-entry
    [preselectedCountry]="{ id: editModalCountry.id, name: editModalCountry.name, emoji: editModalCountry.emoji }"
    [existingEntry]="editModalEntry" (saved)="closeEditModal()" (closed)="closeEditModal()">
</app-add-entry>
}
