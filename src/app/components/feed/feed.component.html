<!-- Unauthenticated state -->
<div class="feed-unauthenticated fade-in" *ngIf="(vm$ | async) as vm; else loading">
    <ng-container *ngIf="!vm.currentUser">
        <div class="welcome-hero">
            <div class="welcome-globe">🌍</div>
            <h1 class="welcome-title">Your travel story, shared.</h1>
            <p class="welcome-sub">Follow travellers, see their adventures unfold, and share your own journey.</p>
            <button class="welcome-signin-btn" (click)="login()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                Sign in with Google
            </button>
        </div>
    </ng-container>

    <!-- Authenticated feed -->
    <ng-container *ngIf="vm.currentUser">
        <div class="feed-header">
            <h2 class="feed-title">Your Feed</h2>
            <span class="feed-count" *ngIf="vm.items.length > 0">{{ vm.items.length }} events</span>
        </div>

        <!-- Empty — not following anyone -->
        <div class="feed-empty glass-panel fade-in" *ngIf="vm.items.length === 0 && !vm.loading">
            <div class="feed-empty-icon">🌐</div>
            <p class="feed-empty-title">Nothing here yet</p>
            <p class="feed-empty-sub">Search for travellers and follow them to see their updates here.</p>
        </div>

        <!-- Timeline -->
        <app-timeline
            *ngIf="vm.items.length > 0"
            [items]="vm.items"
            [loading]="vm.loading"
            [showActor]="true"
            emptyMessage="No activity yet.">
        </app-timeline>
    </ng-container>
</div>

<ng-template #loading>
    <app-timeline [loading]="true" [items]="[]"></app-timeline>
</ng-template>
