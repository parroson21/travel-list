<nav class="glass-panel navbar">
    <div class="container nav-content">
        <div class="brand" routerLink="/">TRAVEL<span>LIST</span></div>
        <div class="nav-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Profile</a>
            <a routerLink="/explore" routerLinkActive="active">Explore</a>
            <a *ngIf="auth.isAdmin$ | async" routerLink="/admin" routerLinkActive="active">Admin</a>
        </div>
        <div class="auth-section">
            <!-- Settings Toggle -->
            <div class="user-menu-wrapper">
                <button class="icon-btn" (click)="toggleSettings($event)" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                        <path
                            d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
                    </svg>
                </button>
                <div class="dropdown-menu settings-dropdown glass-panel" *ngIf="settingsOpen"
                    (click)="$event.stopPropagation()">

                    <!-- Themes Collapsible -->
                    <button class="dropdown-item customize-toggle" (click)="showThemes = !showThemes">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                        </svg>
                        Themes
                        <svg class="chevron" [class.open]="showThemes" width="10" height="10" viewBox="0 0 12 12"
                            style="margin-left: auto;">
                            <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none"
                                stroke-linecap="round" />
                        </svg>
                    </button>

                    <div class="themes-expansion-panel" *ngIf="showThemes">
                        <div class="theme-grid">
                            <button *ngFor="let p of theme.palettes" class="theme-card"
                                [class.active]="theme.selectedPaletteName() === p.name"
                                (click)="theme.setPalette(p.name)">
                                <div class="theme-preview" [style.background]="p.background">
                                    <div class="preview-dot" [style.background]="getPrimaryColor(p)"></div>
                                    <div class="preview-dot secondary" [style.background]="p.secondary"></div>
                                </div>
                                <span class="theme-name">{{ p.name }}</span>
                            </button>
                        </div>
                    </div>

                    <div class="dropdown-divider"></div>

                    <a class="dropdown-item" href="https://github.com/parroson21/travel-list" target="_blank"
                        rel="noopener">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                        </svg>
                        GitHub
                    </a>
                </div>
            </div>

            <!-- User Auth Section -->
            <ng-container *ngIf="auth.user$ | async as user; else loginBtn">
                <div class="user-menu-wrapper">
                    <button class="user-trigger" (click)="toggleMenu($event)">
                        <img *ngIf="user.photoURL" [src]="user.photoURL" class="user-avatar" alt="avatar"
                            referrerpolicy="no-referrer" />
                        <span *ngIf="!user.photoURL" class="user-avatar-fallback">
                            {{ (user.displayName ? user.displayName.split(' ')[0] : (user.email ||
                            '?')).charAt(0).toUpperCase() }}
                        </span>
                        <span class="user-display-name">{{ user.displayName ? user.displayName.split(' ')[0] :
                            user.email }}</span>
                        <svg class="chevron" [class.open]="menuOpen" width="12" height="12" viewBox="0 0 12 12">
                            <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none"
                                stroke-linecap="round" />
                        </svg>
                    </button>
                    <div class="dropdown-menu glass-panel" *ngIf="menuOpen">
                        <div class="dropdown-header">
                            <span class="dropdown-email">{{ user.email }}</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout" (click)="auth.logout(); menuOpen = false">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round">
                                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </ng-container>
            <ng-template #loginBtn>
                <button class="btn btn-primary" (click)="auth.loginWithGoogle()">Login</button>
            </ng-template>
        </div>
    </div>
</nav>

<!-- Mobile FAB navigation -->
<div class="mobile-fab-container">
    <!-- Popup links -->
    <div class="fab-menu" [class.open]="fabOpen">
        <a routerLink="/" class="fab-item" (click)="fabOpen = false" title="Profile">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span>Profile</span>
        </a>
        <a routerLink="/explore" class="fab-item" (click)="fabOpen = false" title="Explore">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
            </svg>
            <span>Explore</span>
        </a>
    </div>
    <!-- FAB button -->
    <button class="fab-btn" (click)="toggleFab($event)" [class.open]="fabOpen">
        <svg *ngIf="!fabOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <svg *ngIf="fabOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
    </button>
</div>
