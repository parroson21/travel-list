<div class="home-container" *ngIf="vm$ | async as vm">

    <!-- Compact top bar: greeting + stats -->
    <header class="top-bar fade-in">
        <div class="greeting">
            <h1>Hi, <span class="highlight">{{ firstName$ | async }}</span></h1>
        </div>
        <div class="stats-row">
            <div class="stat-pill glass-panel">
                <span class="stat-value">{{ vm.stats.countriesVisited }}</span>
                <span class="stat-sep">/</span>
                <span class="stat-total">197</span>
                <span class="stat-label">countries</span>
                <div class="mini-progress">
                    <div class="mini-progress-fill" [style.width.%]="(vm.stats.countriesVisited / 197) * 100"></div>
                </div>
            </div>
            <div class="stat-pill glass-panel">
                <span class="stat-value">{{ vm.stats.poisVisited }}</span>
                <span class="stat-label">heritage <span class="label-full">sites</span></span>
            </div>
        </div>
    </header>

    <!-- Main split: map + countries list -->
    <div class="main-split">

        <!-- Map -->
        <section class="map-panel glass-panel">
            <app-world-map [visitedCountryNames]="vm.visitedCountryNames" [heritageSites]="vm.heritageSites"
                [visitedPOIIds]="vm.visitedPOIIds" [showOnlyVisitedSites]="true" [height]="'600px'"
                (poiToggled)="togglePOIVisited($event, vm.profile)">
            </app-world-map>
        </section>

        <!-- Scrollable countries list -->
        <aside class="countries-panel glass-panel">
            <div class="countries-panel-header">
                <h2>Visited</h2>
                <span class="count-badge">{{ vm.visitedCountries.length }}</span>
            </div>

            <div class="countries-scroll">
                <div class="country-row" *ngFor="let country of vm.visitedCountries"
                    (click)="navigateToCountry(country.id)">
                    <span class="country-flag flag-emoji">{{ country.emoji }}</span>
                    <div class="country-row-info">
                        <span class="country-row-name">{{ country.name }}</span>
                        <span class="country-row-sub">{{ country.continent }}</span>
                    </div>
                </div>

                <div class="empty-state" *ngIf="vm.visitedCountries.length === 0">
                    <p>No countries visited yet.<br>Head to Explore to start tracking!</p>
                </div>
            </div>
        </aside>

    </div>
</div>
